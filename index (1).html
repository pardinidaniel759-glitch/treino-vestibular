<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base Tática | PMESP & Prova Paulista</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>BASE TÁTICA <small>PMESP · Prova Paulista</small></h1>
  <nav>
    <button data-v="guia" class="on">Guia</button>
    <button data-v="edital">Edital</button>
    <button data-v="taf">TAF</button>
    <button data-v="redacao">Redação</button>
    <button data-v="pm">Simulado PMESP</button>
    <button data-v="mapa">Matriz Paulista</button>
    <button data-v="pp">Simulado Paulista</button>
    <button data-v="flash">Flashcards</button>
    <button data-v="pomo">Pomodoro</button>
    <button data-v="notas">Notas</button>
    <button data-v="metas">Meta diária</button>
  </nav>
</header>
<main>
  <section id="guia" class="view on"></section>
  <section id="edital" class="view"></section>
  <section id="taf" class="view"></section>
  <section id="redacao" class="view"></section>
  <section id="pm" class="view"></section>
  <section id="mapa" class="view"></section>
  <section id="pp" class="view"></section>
  <section id="flash" class="view"></section>
  <section id="pomo" class="view">
    <h2>Cronômetro Pomodoro</h2>
    <div class="card center">
      <div id="modo" class="muted">Estudo</div>
      <div id="tempo" class="big">25:00</div>
      <div class="row">
        <label>Estudo (min) <input type="number" id="tE" value="25" min="1" max="120"></label>
        <label>Descanso (min) <input type="number" id="tD" value="5" min="1" max="60"></label>
      </div>
      <div class="row"><button class="btn" id="pIni">Iniciar</button><button class="btn ghost" id="pRes">Reiniciar</button></div>
    </div>
  </section>
  <section id="notas" class="view">
    <h2>Bloco de anotações</h2>
    <div class="card"><textarea id="nota" placeholder="Escreva aqui. O texto é salvo automaticamente neste navegador."></textarea><p class="muted" id="salvo"></p></div>
  </section>
  <section id="metas" class="view"></section>
</main>
<script src="app.js"></script>
</body>
</html>
